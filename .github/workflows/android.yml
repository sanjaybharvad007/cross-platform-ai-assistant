name: android
on:
  push:
    paths: ["android/**", "packages/protocol/fixtures/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "packages/protocol/fixtures/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --no-daemon --stacktrace
      - run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: app-debug.apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
