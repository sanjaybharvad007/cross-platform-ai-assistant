name: android
on:
  push:
    paths: ["android/**", "packages/protocol/fixtures/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "packages/protocol/fixtures/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: core tests
        run: ./gradlew :core:test --no-daemon --console=plain 2>&1 | tee core.log; exit ${PIPESTATUS[0]}
      - name: assemble app
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app.log; exit ${PIPESTATUS[0]}
      - name: surface errors as annotations
        if: failure()
        run: grep -hE "^e: |error:|What went wrong|Could not|Unresolved|FAILED" core.log app.log | head -60 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v4
        with: { name: app-debug.apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
