name: ci
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fixtures && git diff --exit-code packages/protocol/fixtures   # protocol fixtures are up to date
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=dot
      - run: npm run build
  web-e2e:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }
  docker:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t assistant:ci .
      - run: docker run -d --name a assistant:ci && sleep 5 && docker exec a wget -qO- http://localhost:8787/health
      - if: failure()
        run: docker logs a 2>&1 | tail -50 | sed 's/^/::error::/' || true
